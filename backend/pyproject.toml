[project]
name = "agent-evaluation-lab-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "mcp==2.3.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.setuptools.package-data]
lab = ["migrations/*.sql", "rechecking/assets/*.py"]
